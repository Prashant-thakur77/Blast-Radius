# BlastRadius review on every pull request.
# 1. The deterministic engine scores the PR and fails the check at score >= 80 or on a missed caller.
# 2. Bob Shell runs the blast-radius-review skill non-interactively and writes the review comment.
#    Needs repository secret BOB_API_KEY (a Bob API key with Inference scope). Skipped without it.
name: BlastRadius review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install BlastRadius engine
        run: pip install -r blastradius/backend/requirements.txt

      - name: Score the pull request
        id: score
        working-directory: blastradius/backend
        run: |
          set +e
          python -m app.cli review --repo "$GITHUB_WORKSPACE" \
            --base "origin/${{ github.base_ref }}" --head HEAD \
            --json > "$RUNNER_TEMP/blastradius.json"
          python -m app.cli review --repo "$GITHUB_WORKSPACE" \
            --base "origin/${{ github.base_ref }}" --head HEAD \
            --fail-on 80 --fail-on-missed | tee "$RUNNER_TEMP/blastradius.txt"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Install Bob Shell
        if: env.BOB_API_KEY != ''
        run: curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash

      - name: Bob reviews the blast radius
        if: env.BOB_API_KEY != ''
        run: |
          bob run --mode agent --max-cost 3 --format json --trust --accept-license \
            "Use the blast-radius-review skill. The BlastRadius report for this PR is in @$RUNNER_TEMP/blastradius.json. \
             Do not edit application code. Write the review to reviews/ci.md following the reviewer protocol." \
            | tail -n 1 > "$RUNNER_TEMP/bob.json" || true

      - name: Post or update the PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- blastradius-review -->'
            const txt = fs.readFileSync(process.env.RUNNER_TEMP + '/blastradius.txt', 'utf8').replace(/\x1b\[[0-9;]*m/g, '')
            let bob = ''
            try { bob = fs.readFileSync('reviews/ci.md', 'utf8') } catch {}
            const body = `${marker}\n### BlastRadius\n\`\`\`\n${txt.trim()}\n\`\`\`\n${bob ? '\n#### Bob review\n' + bob : ''}`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find(c => c.body && c.body.includes(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Fail on critical blast radius
        if: steps.score.outputs.exit == '2'
        run: |
          echo "BlastRadius: score >= 80 or a caller was left behind. A human must approve this merge."
          exit 1
